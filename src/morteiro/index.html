<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Origem e destino</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10151d; color: #edf2f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 720px; }
    .tag { color: #7de0b2; letter-spacing: .16em; font-size: 12px; font-weight: 700; }
    h1 { font-size: clamp(30px, 6vw, 44px); letter-spacing: -.04em; margin: 12px 0; }
    p { color: #aab7c8; line-height: 1.6; }
    form { background: #19222e; border: 1px solid #303d4e; border-radius: 20px; padding: 28px; margin-top: 30px; }
    label { display: block; font-weight: 650; margin-bottom: 10px; }
    input { width: 100%; background: #101720; border: 1px solid #48576b; border-radius: 10px; padding: 16px; font: inherit; color: #edf2f8; }
    input:focus-visible, button:focus-visible { outline: 3px solid #7de0b2; outline-offset: 3px; }
    input[readonly] { border-color: #7de0b2; background: #1c302c; }
    .lock { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; font-size: 14px; cursor: pointer; }
    .lock input { width: 18px; height: 18px; padding: 0; accent-color: #7de0b2; }
    .field + .field { margin-top: 24px; }
    .hint { font-size: 13px; margin: 8px 0 0; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
    button { border: 0; border-radius: 10px; padding: 13px 18px; font: inherit; font-weight: 650; cursor: pointer; background: #7de0b2; color: #102219; }
    button.secondary { background: #2c394a; color: #edf2f8; }
    #result { margin-top: 22px; line-height: 1.8; white-space: pre-line; }
    #result.error { color: #ffaaa5; }
    footer { color: #8393a7; font-size: 12px; margin-top: 20px; }
    @media (max-width: 480px) { form { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <span class="tag">COORDENADAS</span>
    <h1>Origem e destino</h1>
    <p>Cole as coordenadas de cada ponto nos campos abaixo.</p>
    <form id="coordinates">
      <div class="field">
        <label for="origin">Origem</label>
        <input id="origin" name="origin" placeholder="x101.33, y59.98" required autocomplete="off" spellcheck="false" aria-describedby="origin-hint">
        <p class="hint" id="origin-hint">Exemplo: x101.33, y59.98</p>
        <label class="lock" for="lock-origin"><input type="checkbox" id="lock-origin"> Fixar origem</label>
      </div>
      <div class="field">
        <label for="destination">Destino</label>
        <input id="destination" name="destination" placeholder="x97.27, y61.27" required autocomplete="off" spellcheck="false" aria-describedby="destination-hint">
        <p class="hint" id="destination-hint">Exemplo: x97.27, y61.27</p>
      </div>
      <div class="actions">
        <button type="submit">Confirmar coordenadas</button>
        <button type="reset" class="secondary">Limpar</button>
      </div>
      <div id="result" role="status" aria-live="polite"></div>
    </form>
    <footer>Servidor local em Python · http.server</footer>
  </main>
  <script>
    const form = document.querySelector('form');
    const origin = document.querySelector('#origin');
    const destination = document.querySelector('#destination');
    const result = document.querySelector('#result');
    const lockOrigin = document.querySelector('#lock-origin');
    const clear = document.querySelector('button[type="reset"]');
    lockOrigin.addEventListener('change', () => {
      origin.readOnly = lockOrigin.checked;
      clear.textContent = lockOrigin.checked ? 'Limpar destino' : 'Limpar';
      clearResult();
    });
    function parsePoint(value) {
      const match = value.trim().match(/^x\s*([+-]?(?:\d+(?:\.\d+)?|\.\d+))\s*,\s*y\s*([+-]?(?:\d+(?:\.\d+)?|\.\d+))$/i);
      if (!match) return null;
      const point = { x: Number(match[1]), y: Number(match[2]) };
      return Number.isFinite(point.x) && Number.isFinite(point.y) ? point : null;
    }
    function clearResult() { result.textContent = ''; result.className = ''; }
    form.addEventListener('submit', event => {
      event.preventDefault();
      clearResult();
      const a = parsePoint(origin.value);
      const b = parsePoint(destination.value);
      if (!a || !b) {
        result.className = 'error';
        result.textContent = `Confira ${!a ? 'a origem' : 'o destino'}. Use o formato x101.33, y59.98, com ponto nos decimais.`;
        (!a ? origin : destination).focus();
        return;
      }
      result.textContent = `Coordenadas confirmadas.\nOrigem: X ${a.x} · Y ${a.y}\nDestino: X ${b.x} · Y ${b.y}`;
    });
    form.addEventListener('reset', event => {
      if (lockOrigin.checked) {
        event.preventDefault();
        destination.value = '';
      }
      clearResult();
    });
    form.addEventListener('input', clearResult);
  </script>
</body>
</html>
